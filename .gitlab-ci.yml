stages:
  - test
  - build
  - verify

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  GOPROXY: "https://goproxy.cn,direct"
  GOSUMDB: "sum.golang.google.cn"
  GOTOOLCHAIN: "auto"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

backend-test:
  stage: test
  image: golang:1.27.0-alpine
  variables:
    CGO_ENABLED: "0"
  cache:
    key: gomod-$CI_COMMIT_REF_SLUG
    paths:
      - .gocache/
  before_script:
    - export GOMODCACHE="$CI_PROJECT_DIR/.gocache/mod" GOCACHE="$CI_PROJECT_DIR/.gocache/build"
  script:
    - cd backend
    - go build ./...
    - go test ./internal/service/ -run 'Bedrock|OpenAIEndpoint|IsModelSupported|ModelMapping' -count=1

frontend-test:
  stage: test
  image: node:24-alpine
  cache:
    key: pnpm-$CI_COMMIT_REF_SLUG
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable && corepack prepare pnpm@9 --activate
    - cd frontend
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile
  script:
    - pnpm run typecheck
    - pnpm exec vitest run src/components/account/__tests__/credentialsBuilder.spec.ts

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: [backend-test, frontend-test]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - >
      docker build
      --build-arg GOPROXY="$GOPROXY"
      --build-arg GOSUMDB="$GOSUMDB"
      --build-arg VERSION="$IMAGE_TAG"
      --build-arg COMMIT="$CI_COMMIT_SHORT_SHA"
      --build-arg DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      -t "$IMAGE_NAME:$IMAGE_TAG"
      -t "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
      .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:latest"
      fi

image-smoke-test:
  stage: verify
  image: docker:27
  services:
    - docker:27-dind
  needs: [docker-build]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$IMAGE_NAME:$IMAGE_TAG"
    - docker run --rm "$IMAGE_NAME:$IMAGE_TAG" /app/sub2api --version
    - docker run --rm --entrypoint sh "$IMAGE_NAME:$IMAGE_TAG" -c 'test -x /app/sub2api && which pg_dump psql'
