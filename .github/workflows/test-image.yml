name: Test image

on:
  push:
    branches: ['feat/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: test-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image name
        id: meta
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:test-${ref}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ref_tag=ghcr.io/${GITHUB_REPOSITORY,,}:test-${ref}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.ref_tag }}
          build-args: |
            VERSION=test-${{ github.sha }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" /app/sub2api --version
          docker run --rm --entrypoint sh "$IMAGE" -c 'test -x /app/sub2api && command -v pg_dump && command -v psql'
